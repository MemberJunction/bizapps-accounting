<mj-page-layout>
  <mj-page-body [Flex]="true" [Padding]="false" Direction="row">
    <mj-left-nav
      [Sections]="RailSections"
      [ActiveId]="ActivePageId"
      [MobileTitle]="CategoryTitle"
      (ItemClicked)="OnRailItemClicked($event)">
      <div header>
        <mj-company-scope-chip></mj-company-scope-chip>
      </div>
    </mj-left-nav>

    <mj-left-nav-content>
      @switch (ActivePageId) {
        @case ('dashboard') {
          <mj-batches-dashboard-page></mj-batches-dashboard-page>
        }
        @case ('all-batches') {
          <mj-batch-status-dashboard></mj-batch-status-dashboard>
        }
        @case ('approvals') {
          <mj-batch-dispatch-dashboard></mj-batch-dispatch-dashboard>
        }
        @case ('workspace') {
          <mj-batch-workspace-page></mj-batch-workspace-page>
        }
        @case ('dispatch') {
          <mj-dispatch-status-page></mj-dispatch-status-page>
        }
        @default {
          <mj-shell-page-pending [PageName]="PendingPageName(ActivePageId)"></mj-shell-page-pending>
        }
      }
    </mj-left-nav-content>
  </mj-page-body>
</mj-page-layout>
