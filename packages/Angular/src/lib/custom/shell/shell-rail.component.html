<!-- The rail column: MJ's nav (scrolls) above a toggle that never does.

     The toggle sits OUTSIDE <mj-left-nav> on purpose. MJ's [footer] slot renders INSIDE the rail's
     `overflow-y: auto` box, so a footer scrolls away with the items — an affordance you have to go
     find is not an affordance. Out here it is always on screen, and it carries its own right border
     so the rail's edge line runs unbroken to the bottom rather than stopping where MJ's <aside> ends. -->
<!-- .sr--collapsed (icons-only) applies only when truly collapsed AND not hover-peeking: peeking shows
     the full expanded rail (labels + wide) so the words come back exactly as on click-expand. -->
<div class="sr" [class.sr--collapsed]="Collapsed && !HoverExpanded">
  <mj-left-nav
    class="sr__nav"
    [Sections]="Sections"
    [ActiveId]="ActiveId"
    [MobileTitle]="MobileTitle"
    [Width]="RailWidth"
    (ItemClicked)="onItemClicked($event)">

    <!-- The toggle lives INSIDE the nav via MJ's [header] slot (Marcelo 2026-07-21): being in the SAME
         container as the nav items, it inherits the nav's padding, so it spaces identically by
         construction. At the TOP so it's dock/taskbar-safe. NOT a hamburger (Marcelo 2026-08-04 — a
         lone hamburger row read as a broken nav item): double-angles, the conventional rail-collapse
         glyphs — « to collapse, » to expand. The chip is LOCKED in one spot (centred in the collapsed
         60px band) in BOTH modes (Marcelo 2026-08-04): only the glyph flips on toggle, so the user
         never re-aims, and the divider + items below never shift (the no-shift north star). -->
    <button
      header
      type="button"
      class="sr__toggle"
      [attr.aria-label]="ToggleLabel"
      [attr.aria-expanded]="!Collapsed"
      [title]="ToggleLabel"
      (click)="Toggle()">
      <i
        class="fa-solid sr__toggle-icon"
        [class.fa-angles-right]="Collapsed"
        [class.fa-angles-left]="!Collapsed"
        aria-hidden="true"></i>
    </button>
    <!-- Wordless divider between the toggle and the nav items (Marcelo 2026-07-29): the toggle is
         deliberately styled as a nav row, so without a boundary it reads as a destination. Projected
         into the same [header] slot so it renders directly under the toggle in every mode. -->
    <div header class="sr__divider" aria-hidden="true"></div>
  </mj-left-nav>
</div>
