<!-- The rail column: MJ's nav (scrolls) above a toggle that never does.

     The toggle sits OUTSIDE <mj-left-nav> on purpose. MJ's [footer] slot renders INSIDE the rail's
     `overflow-y: auto` box, so a footer scrolls away with the items — an affordance you have to go
     find is not an affordance. Out here it is always on screen, and it carries its own right border
     so the rail's edge line runs unbroken to the bottom rather than stopping where MJ's <aside> ends. -->
<!-- .sr--collapsed (icons-only) applies only when truly collapsed AND not hover-peeking: peeking shows
     the full expanded rail (labels + wide) so the words come back exactly as on click-expand. -->
<div class="sr" [class.sr--collapsed]="Collapsed && !HoverExpanded">
  <!-- The toggle sits at the TOP of the rail (Marcelo 2026-07-21): a bottom-anchored control collides
       with the OS dock / taskbar at the screen's bottom edge (cross-machine). At the top it's always
       reachable and dock-safe. An ARROW (not a hamburger): the menu is already on screen, so an arrow —
       "which way the thing next to it moves" — is the honest promise. aria-expanded reports state. -->
  <button
    type="button"
    class="sr__toggle"
    [attr.aria-label]="ToggleLabel"
    [attr.aria-expanded]="!Collapsed"
    [title]="ToggleLabel"
    (click)="Toggle()">
    <!-- A HAMBURGER that never changes/swaps (Marcelo): the constant menu glyph, fixed in the icon
         column like every nav icon. When EXPANDED we add a left chevron after it as the collapse cue —
         the hamburger itself does not move or morph between states. -->
    <i class="fa-solid fa-bars sr__toggle-icon" aria-hidden="true"></i>
    <!-- Caret + text are hidden by .sr--collapsed CSS (same as the nav labels), so they show whenever the
         rail is wide — expanded OR hover-peeked — and the hamburger alone shows when truly collapsed. -->
    <i class="fa-solid fa-angle-left sr__toggle-caret" aria-hidden="true"></i>
    <span class="sr__toggle-text">Collapse</span>
  </button>

  <mj-left-nav
    class="sr__nav"
    [Sections]="Sections"
    [ActiveId]="ActiveId"
    [MobileTitle]="MobileTitle"
    [Width]="RailWidth"
    (ItemClicked)="onItemClicked($event)">
  </mj-left-nav>
</div>
