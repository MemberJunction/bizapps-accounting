<mj-slide-panel [Visible]="Visible" [Title]="Title" (Closed)="Close()">
  <!-- .jed owns the panel's internal gutters: mj-slide-panel's .sp-body has NO padding of its own,
       so without this everything sits flush against the panel edge and the header rule. Gutters
       match the panel header's own 16px/24px rhythm. -->
  <div class="jed">
    <!-- Pop-out (↗) is required on every slide-in by the element doctrine, and it belongs to the
         PANEL rather than the widget: "open this somewhere else" is a presentation decision, and
         a widget that made it could not be embedded on the surface it wants to pop out to. -->
    <div class="jed__actions">
      <button type="button" mjButton variant="outline" size="sm" (click)="PopOut()"
              title="Open the full entry (closes this panel)">
        <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i> Open full
      </button>
    </div>

    <!-- The entry itself — the same widget the Explorer Journal Entry form embeds. -->
    <mjacc-journal-entry-detail
        [JournalEntryID]="JournalEntryID"
        [Provider]="ProviderToUse"
        (AfterHeaderLoaded)="OnHeaderLoaded($event)"
        (AfterReversalRequested)="OnAfterReversal($event)"
        (RecordOpenRequested)="OnRecordOpenRequested($event)"></mjacc-journal-entry-detail>
  </div>
</mj-slide-panel>
