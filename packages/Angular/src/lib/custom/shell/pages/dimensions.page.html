<mj-page-header-interior>
  <div meta>
    <mj-stat-badge [Count]="Dimensions.length" Label="dimensions" Variant="default"></mj-stat-badge>
  </div>
  <!-- One line: the search sits where the drop-downs' right edge would be (Marcelo's filter-bar rule). -->
  <div toolbar class="dim-filters">
    <label class="dim-field dim-field--search">
      <span class="dim-field__label">Search</span>
      <input
        class="mj-input"
        [(ngModel)]="Search"
        (ngModelChange)="OnSearchChanged()"
        placeholder="Code, name or ID…"
        aria-label="Search dimensions by code, name or ID" />
    </label>
  </div>
</mj-page-header-interior>

<!-- Scrollable body — <mj-page-body-interior> is the interior primitive
     <mj-left-nav-content> expects; it owns the gutters that keep content off the rail and
     off the page edge. NOTE it is display:block, so children size with height/min-height,
     never with flex. -->
<mj-page-body-interior>
@if (LoadError) {
  <mj-alert Variant="error" [Message]="LoadError"></mj-alert>
}

<div class="dim-cols">
  <aside class="dim-master" aria-label="Dimensions">
    @for (d of FilteredDimensions; track d.ID) {
      <button type="button" class="dim-item" [class.dim-item--active]="d.ID === SelectedID" (click)="Select(d.ID)" [title]="d.ID">
        <span class="dim-item__code">{{ d.Code }}</span>
        <span class="dim-item__name">{{ d.Name }}</span>
        <!-- Code + name are how a human finds it; the id is here to be copied (full id on hover,
             and the search box above matches it in full). -->
        <span class="dim-item__id">{{ d.ID.slice(0, 8) }}…</span>
        @if (!d.IsActive) {
          <span class="dim-item__inactive">inactive</span>
        }
      </button>
    } @empty {
      @if (!IsLoading) {
        <p class="dim-empty">{{ Search ? 'No dimensions match this search.' : 'No dimensions defined.' }}</p>
      }
    }
  </aside>

  <section class="dim-values" aria-label="Dimension values">
    @if (Selected) {
      <p class="dim-values__title">{{ Selected.Name }} values</p>
      <div class="dim-grid">
        <mj-entity-data-grid
          [Params]="ValueParams"
          [Columns]="ValueColumns"
          PaginationMode="client"
          [ShowPager]="true"
          [ShowToolbar]="false"
          [AllowSorting]="true"
          KeyField="ID"
          StateKey="mj.bizappsacct.grid.dimensionValues.v1"
          [AutoPersistState]="true"
          Height="auto">
        </mj-entity-data-grid>
      </div>
    } @else if (!IsLoading) {
      <mj-empty-state Icon="fa-solid fa-tags" Title="Select a dimension" Message="Pick a dimension on the left to see its values."></mj-empty-state>
    }
  </section>
</div>
</mj-page-body-interior>
