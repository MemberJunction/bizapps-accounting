<!-- Sub-page of a left-nav shell → mj-page-header-interior, NOT mj-page-header (which would double
     the header). Slot conventions: [meta] = state, [actions] = verbs, [toolbar] = filters. -->
<mj-page-header-interior
  Title="All journal entries"
  Subtitle="The ledger — every count below reflects the filters, exactly like the grid. Sorted by effective date, newest first.">
  <!-- Overview stats. Each is a filtered COUNT over the SAME predicate the grid uses (MaxRows 1 +
       TotalRowCount — §0: no on-demand aggregates), so a chip can never disagree with the rows. The
       subtitle states that on screen. A status with 0 matches is hidden, as on All batches. -->
  <div meta>
    <mj-stat-badge [Label]="ScopeLabel" Icon="fa-solid fa-building" Variant="info"></mj-stat-badge>
    <mj-stat-badge Icon="fa-solid fa-book-open" [Count]="TotalCount ?? '—'" Label="entries" Variant="default" />
    @for (s of Statuses; track s) {
      @if (StatusCount(s) > 0) {
        <mj-stat-badge [Count]="StatusCount(s)" [Label]="s" [Variant]="BadgeVariant(s)" />
      }
    }
  </div>

  <div actions>
    <!-- The ONE refresh control per list (§8 dispatch refresh policy). Deleting this seam is how
         live push lands later — there is deliberately no polling and no per-button wiring. -->
  </div>

  <!-- The All-batches filter setup, applied here verbatim in idiom: status toggles + company +
       a calendar range + window presets — plus this list's own entry-type filter and search.
       ONE ROW on the desktop (the drop-downs side by side, search last on the right); it wraps only
       when the viewport can't hold it. -->
  <div toolbar>
    <div class="aje-filters">
      <div class="aje-field">
        <span class="aje-field__label">Status</span>
        <div class="aje-toggles">
          <button mjButton size="sm" [variant]="ToggleVariant(AllStatusesShown)" (click)="ShowAllStatuses()">All</button>
          @for (s of Statuses; track s) {
            <button mjButton size="sm" [variant]="ToggleVariant(IsStatusOn(s))" (click)="ToggleStatus(s)">{{ s }}</button>
          }
        </div>
      </div>

      <label class="aje-field">
        <span class="aje-field__label">Company</span>
        <select class="mj-input" [(ngModel)]="CompanyID" (ngModelChange)="OnFilterChanged()" aria-label="Company">
          <option [ngValue]="null">All companies</option>
          @for (co of Companies; track co.ID) {
            <option [ngValue]="co.ID">{{ co.Name }}</option>
          }
        </select>
      </label>

      <label class="aje-field">
        <span class="aje-field__label">Entry type</span>
        <select class="mj-input" [(ngModel)]="TypeFilter" (ngModelChange)="OnFilterChanged()" aria-label="Entry type">
          <option value="All">All types</option>
          @for (t of EntryTypes; track t) {
            <option [value]="t">{{ t }}</option>
          }
        </select>
      </label>

      <label class="aje-field">
        <span class="aje-field__label">Window</span>
        <select class="mj-input" [(ngModel)]="TimeWindow" (ngModelChange)="OnWindowChanged()" aria-label="Time window">
          @for (w of TimeWindows; track w.Id) {
            <option [value]="w.Id">{{ w.Label }}</option>
          }
          <option value="custom">Custom range</option>
        </select>
      </label>

      <label class="aje-field aje-field--date">
        <span class="aje-field__label">From</span>
        <input type="date" class="mj-input" [(ngModel)]="FromDate" (ngModelChange)="OnDateChanged()" aria-label="Effective date from" />
      </label>

      <label class="aje-field aje-field--date">
        <span class="aje-field__label">To</span>
        <input type="date" class="mj-input" [(ngModel)]="ToDate" (ngModelChange)="OnDateChanged()" aria-label="Effective date to" />
      </label>

      <label class="aje-field aje-field--grow">
        <span class="aje-field__label">Search</span>
        <input
          type="search"
          class="mj-input"
          placeholder="Memo, entry № or ID"
          [(ngModel)]="Search"
          (change)="OnFilterChanged()"
          aria-label="Search entries" />
      </label>
    </div>
  </div>
</mj-page-header-interior>

<!-- MJ's house grid (§8 MJ-wins): AG Grid + RunView loading + server sorting + export + per-user
     grid state.

     PaginationMode="client" is an INTERIM choice, not the target. The plan wants server-side
     paging ("keyset / Load more") for the thousands-of-JEs case, which is MJ's `infinite` mode —
     but infinite mode currently renders a permanent "No data to display" overlay OVER a populated
     grid, because the grid's empty state is gated on `rowData.length === 0` while infinite mode
     feeds rows through AG's IDatasource and never fills `rowData`. Logged in MJ-UPSTREAM.md.
     Switch back to infinite (with ShowPager off) the moment that lands. Our JE volume is small, so
     client mode is honest and correct today. -->
<!-- The scrollable body is <mj-page-body-interior> — the interior primitive left-nav-content
     expects. It owns the padding that keeps content off the rail. -->
<mj-page-body-interior>
  <div class="aje-grid">
  <mj-entity-data-grid
    [Params]="GridParams"
    [Columns]="Columns"
    PaginationMode="client"
    [PageSize]="100"
    [ShowPager]="true"
    [AllowSorting]="true"
    [ShowToolbar]="false"
    [SelectionMode]="'single'"
    KeyField="ID"
    StateKey="mj.bizappsacct.grid.allJournalEntries.v1"
    [AutoPersistState]="true"
    Height="auto"
    (AfterRowClick)="OnRowClicked($event.rowKey)">
  </mj-entity-data-grid>
  </div>
</mj-page-body-interior>

<!-- Row detail: lines + lineage + reversal chain + batch membership + the C.8 chip. -->
<mj-journal-entry-detail-panel
  [JournalEntryID]="SelectedID"
  (Closed)="OnDetailClosed()"
  (Changed)="OnDetailChanged()">
</mj-journal-entry-detail-panel>
