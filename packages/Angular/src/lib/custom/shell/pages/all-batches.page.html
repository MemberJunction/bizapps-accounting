<mj-page-body-interior [Padding]="false">
  <!-- The page owns the gutter (16px sides) so the strip / toolbar / grid bubbles align edge-for-edge
       with the header-interior bubble above (whose margin is 16px) — body-interior's responsive
       24/32px default made every bubble narrower than the header (Marcelo 2026-08-04). -->
  <div class="abt-body">
  <!-- The ONE subheader band: stats + toolbar fused (Marcelo 2026-08-04); the title card is gone —
       the rail already names the page. Figures are filtered COUNTs over the grid's own predicate. -->
  <div class="abt-subheader">
  <mja-summary-strip
    [Bare]="true"
    [Figures]="SummaryFigures"
    Note="Counts follow the active filters — they describe the list below, not every batch ever built." />

  <!-- Search + status chips + the Filters disclosure (company + posting-date window inside). -->
  <mja-list-toolbar
    [Bare]="true"
    [Search]="Search"
    SearchPlaceholder="Batch №, ERP reference or ID…"
    [Presets]="StatusChips"
    [ActiveKeys]="ActiveStatusKeys"
    [HasAdvanced]="true"
    [AdvancedCount]="AdvancedCount"
    [(AdvancedOpen)]="AdvancedOpen"
    (SearchChanged)="OnSearchChanged($event)"
    (PresetToggled)="OnPresetToggled($event)">
    <label class="abt-field">
      <span class="abt-field__label">Company</span>
      <select class="mj-input" [(ngModel)]="CompanyID" (ngModelChange)="OnFilterChanged()" aria-label="Company">
        <option [ngValue]="null">All companies</option>
        @for (co of Companies; track co.ID) {
          <option [ngValue]="co.ID">{{ co.Name }}</option>
        }
      </select>
    </label>

    <label class="abt-field">
      <span class="abt-field__label">Window</span>
      <select class="mj-input" [(ngModel)]="TimeWindow" (ngModelChange)="OnWindowChanged()" aria-label="Posting-date window">
        @for (w of TimeWindows; track w.Id) {
          <option [value]="w.Id">{{ w.Label }}</option>
        }
        <option value="custom">Custom range</option>
      </select>
    </label>

    <label class="abt-field abt-field--date">
      <span class="abt-field__label">From</span>
      <input type="date" class="mj-input" [(ngModel)]="FromDate" (ngModelChange)="OnDateChanged()" aria-label="Posting date from" />
    </label>

    <label class="abt-field abt-field--date">
      <span class="abt-field__label">To</span>
      <input type="date" class="mj-input" [(ngModel)]="ToDate" (ngModelChange)="OnDateChanged()" aria-label="Posting date to" />
    </label>
  </mja-list-toolbar>
  </div>

  <!-- MJ's house grid, bubbled — same interim client pagination as All JEs (see that page's note). -->
  <div class="abt-grid">
  <mj-entity-data-grid
    [Params]="GridParams"
    [Columns]="Columns"
    PaginationMode="client"
    [PageSize]="100"
    [ShowPager]="true"
    [AllowSorting]="true"
    [ShowToolbar]="false"
    [SelectionMode]="'single'"
    KeyField="ID"
    StateKey="mj.bizappsacct.grid.allBatches.v1"
    [AutoPersistState]="true"
    Height="auto"
    (AfterRowClick)="OnRowClicked($event.rowKey)">
  </mj-entity-data-grid>
  </div>
  </div>
</mj-page-body-interior>

<!-- Row detail: identity, dispatch trail, totals, member entries; workspace + pop-out verbs. -->
<mj-batch-detail-panel
  [BatchID]="SelectedID"
  (Closed)="OnDetailClosed()"
  (OpenInWorkspace)="OnOpenInWorkspace($event)">
</mj-batch-detail-panel>
