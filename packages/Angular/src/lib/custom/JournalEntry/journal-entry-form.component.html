@if (record) {
<mj-record-form-container [Record]="record" [FormComponent]="this"
    (Navigate)="OnFormNavigate($event)"
    (DeleteRequested)="OnDeleteRequested()"
    (FavoriteToggled)="OnFavoriteToggled()"
    (HistoryRequested)="OnHistoryRequested()"
    (ListManagementRequested)="OnListManagementRequested()">

  <!-- ── Details (key fields) ──────────────────────────────────────────────── -->
  <mj-collapsible-panel SectionKey="details" SectionName="Details" Icon="fa fa-align-left"
      [Form]="this" [FormContext]="formContext">
    <mj-form-field [Record]="record" [ShowLabel]="true" FieldName="EntryNumber" Type="textbox"
        [EditMode]="EditMode" [FormContext]="formContext"></mj-form-field>
    <mj-form-field [Record]="record" [ShowLabel]="true" FieldName="CompanyID" Type="textbox"
        [EditMode]="EditMode" [FormContext]="formContext" LinkType="Record"></mj-form-field>
    <mj-form-field [Record]="record" [ShowLabel]="true" FieldName="EntryType" Type="textbox"
        [EditMode]="EditMode" [FormContext]="formContext"></mj-form-field>
    <mj-form-field [Record]="record" [ShowLabel]="true" FieldName="Status" Type="textbox"
        [EditMode]="EditMode" [FormContext]="formContext"></mj-form-field>
    <mj-form-field [Record]="record" [ShowLabel]="true" FieldName="EffectiveDate" Type="textbox"
        [EditMode]="EditMode" [FormContext]="formContext"></mj-form-field>
    <mj-form-field [Record]="record" [ShowLabel]="true" FieldName="Description" Type="textarea"
        [EditMode]="EditMode" [FormContext]="formContext"></mj-form-field>
  </mj-collapsible-panel>

  <!-- ── The entry itself ──────────────────────────────────────────────────────
       One widget. The status timeline, the reversal affordance, the lines with their
       dimension tags, the Dr/Cr totals and the lineage links all live in
       <mjacc-journal-entry-detail>, shared with the journal-entries slide-in.

       [ShowIdentity]="false" because the field panel above already states the entry's
       identity — the widget offers the strip and this surface declines it. That is what a
       reusable widget's inputs are FOR: hosts differ, so the widget is configurable and the
       host stays thin.                                                                    -->
  <mj-collapsible-panel SectionKey="lines" SectionName="Lines &amp; Dimensions" Icon="fa fa-list-ol"
      [Form]="this" [FormContext]="formContext">
    <mjacc-journal-entry-detail
        [Header]="HeaderView"
        [Provider]="ProviderToUse"
        [ShowIdentity]="false"
        (BeforeReversalRequested)="OnBeforeReversal($event)"
        (AfterReversalRequested)="OnAfterReversal($event)"
        (RecordOpenRequested)="OnRecordOpenRequested($event)"></mjacc-journal-entry-detail>
  </mj-collapsible-panel>

</mj-record-form-container>
}
