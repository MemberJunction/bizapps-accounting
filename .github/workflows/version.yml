# Maintains the "Version Packages" PR into `next`.
#
# This workflow NEVER publishes. Its only job is to turn the changesets sitting on `next`
# into a reviewable pull request containing the version bumps, the generated CHANGELOGs,
# the mj-app.json version sync, and a refreshed lockfile. Merging that PR is what makes
# `next` genuinely hold the new version.
#
# Why it exists: the release used to compute the version at publish time and push the
# result straight to `main` (and then to `next`). Both branches are covered by the
# `main-next-protect` ruleset, which requires a pull request, and `github-actions[bot]`
# cannot be granted a bypass — GitHub blocks that by design. Accounting's 0.2.0 published
# to npm and then failed with `GH013`, leaving the registry at 0.2.0 and the repo at
# 0.1.1 with no tag. Routing the bump through a PR removes the need to write to a
# protected branch at all, which is also the pattern `changesets/action` is built for.
name: Version Packages

on:
  push:
    branches: [next]
  workflow_dispatch:

permissions:
  contents: write # push the changeset-release/next branch
  pull-requests: write # open and update the Version Packages PR

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true # the bump-level check compares migrations/ against the last v* tag

      # Must precede setup-node: `cache: 'pnpm'` needs pnpm already on PATH.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ported from publish.yml's old "Determine next expected version" step. That step
      # predicted the bump independently and aborted the release on a mismatch, which is how
      # a migrations-bearing release was stopped from shipping as a patch. Under the split
      # there is nothing left to compare at publish time — changesets alone decide the
      # version — so the check moves here, to the one place where a wrong bump level is still
      # cheap to fix: the Version Packages PR, before anything is published.
      - name: Check the bump level matches what changed
        run: |
          PENDING=$(find .changeset -name "*.md" -not -name "README.md" 2>/dev/null | wc -l | tr -d ' ')
          if [ "$PENDING" -eq 0 ]; then
            echo "No pending changesets — nothing to check"
            exit 0
          fi

          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            echo "No v* tag yet — cannot compare, skipping"
            exit 0
          fi

          MIGRATIONS_CHANGED=$(git --no-pager diff --name-only "$LAST_TAG" HEAD -- migrations/ || true)
          if [ -z "$MIGRATIONS_CHANGED" ]; then
            echo "No migration changes since $LAST_TAG — any bump level is fine"
            exit 0
          fi

          if grep -qhE '^"@mj-biz-apps/.*":[[:space:]]*(minor|major)' .changeset/*.md; then
            echo "Migrations changed since $LAST_TAG and a minor/major changeset is present — ok"
            exit 0
          fi

          echo "::error::migrations/ changed since $LAST_TAG but every pending changeset is a patch. A release that ships migrations is a minor at least — a consumer upgrading on a patch would not expect schema changes. Raise one changeset to minor. Files changed:"
          echo "$MIGRATIONS_CHANGED"
          exit 1

      - uses: changesets/action@v1
        with:
          # No `publish-script`: this workflow only ever versions.
          version-script: pnpm run version:ci
          pr-title: 'chore(release): version packages'
          commit-message: 'chore(release): version packages'
          # NOTE: with the default GITHUB_TOKEN, PRs this action opens do NOT trigger other
          # workflows (GitHub's anti-recursion rule), so build.yml will not run on the
          # Version Packages PR and `--frozen-lockfile` goes unverified until merge. Swap in
          # a GitHub App token to fix that — App-created PRs do trigger workflows.
          github-token: ${{ secrets.GITHUB_TOKEN }}
