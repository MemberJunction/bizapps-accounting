# Maintains the "Version Packages" PR into `next`.
#
# This workflow NEVER publishes. Its only job is to turn the changesets sitting on `next`
# into a reviewable pull request containing the version bumps, the generated CHANGELOGs,
# the mj-app.json version sync, and a refreshed lockfile. Merging that PR is what makes
# `next` genuinely hold the new version.
#
# Why it exists: the release used to compute the version at publish time and push the
# result straight to `main` (and then to `next`). Both branches are covered by the
# `main-next-protect` ruleset, which requires a pull request, and `github-actions[bot]`
# cannot be granted a bypass — GitHub blocks that by design. Accounting's 0.2.0 published
# to npm and then failed with `GH013`, leaving the registry at 0.2.0 and the repo at
# 0.1.1 with no tag. Routing the bump through a PR removes the need to write to a
# protected branch at all, which is also the pattern `changesets/action` is built for.
name: Version Packages

on:
  push:
    branches: [next]
  workflow_dispatch:

permissions:
  contents: write # push the changeset-release/next branch
  pull-requests: write # open and update the Version Packages PR

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true # the bump-level check compares migrations/ against the last v* tag

      # Must precede setup-node: `cache: 'pnpm'` needs pnpm already on PATH.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: changesets/action@v1
        with:
          # No `publish-script`: this workflow only ever versions.
          version-script: pnpm run version:ci
          pr-title: 'chore(release): version packages'
          commit-message: 'chore(release): version packages'
          # NOTE: with the default GITHUB_TOKEN, PRs this action opens do NOT trigger other
          # workflows (GitHub's anti-recursion rule), so build.yml will not run on the
          # Version Packages PR and `--frozen-lockfile` goes unverified until merge. Swap in
          # a GitHub App token to fix that — App-created PRs do trigger workflows.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The bump-level gate, at the earliest point the answer is knowable.
      #
      # changesets/action ran version-script in this workspace, so the tree now holds the
      # RESOLVED version — the same numbers the Version Packages PR contains. That means the
      # check can compare versions directly rather than guessing intent from changeset files,
      # and it fires here rather than waiting for the release PR.
      #
      # Why that matters: catching it on the next -> main PR is correct but expensive to act
      # on — raise a changeset, wait for this PR to regenerate, merge it, redo the release PR.
      # Catching it here means the only step is "raise a changeset to minor", and the Version
      # Packages PR updates itself. release-readiness.yml keeps the identical assertion as the
      # hard gate on main, so this is the friendly early copy, not the enforcement.
      #
      # A label on the version branch would be another way to get here, but it is not needed:
      # the branch is bot-created with a deterministic name, and this step runs in the same job
      # that creates it — no human step to remember, and it works with the default
      # GITHUB_TOKEN. A check attached to the version PR itself would NOT run today, since PRs
      # opened by GITHUB_TOKEN do not trigger workflows.
      - name: A release carrying migrations must be at least a minor
        run: |
          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            echo "No v* tag yet — nothing to compare against"
            exit 0
          fi

          MIGRATIONS=$(git --no-pager diff --name-only "$LAST_TAG" HEAD -- migrations/ || true)
          if [ -z "$MIGRATIONS" ]; then
            echo "No migration changes since $LAST_TAG — any bump level is fine"
            exit 0
          fi

          VERSION=$(jq -r .version packages/Entities/package.json)
          PREV=${LAST_TAG#v}
          if [ "$VERSION" = "$PREV" ]; then
            echo "No pending changesets consumed this run — nothing to check"
            exit 0
          fi

          IFS='.' read -r PMAJ PMIN _ <<< "$PREV"
          IFS='.' read -r NMAJ NMIN _ <<< "$VERSION"
          if [ "$NMAJ" -gt "$PMAJ" ] || { [ "$NMAJ" -eq "$PMAJ" ] && [ "$NMIN" -gt "$PMIN" ]; }; then
            echo "$PREV -> $VERSION is a minor or major bump, and migrations changed — ok"
            exit 0
          fi

          echo "::error::The pending changesets bump $PREV -> $VERSION, a patch, but migrations/ changed since $LAST_TAG. A consumer upgrading on a patch would not expect schema changes. Raise one changeset on next to minor — the Version Packages PR will regenerate itself, and no release PR has to be redone. Migrations changed:"
          echo "$MIGRATIONS" | sed 's/^/  /'
          exit 1
