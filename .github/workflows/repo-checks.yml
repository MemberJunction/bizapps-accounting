name: Repo checks

# Guards specific to this repo. They live here, not in changes.yml, because changes.yml and the
# other release workflows are copied byte-for-byte from the reference repo (bizapps-issues) and
# must stay identical across the open apps. Before the release-pipeline port these steps ran
# inside this repo's old changes.yml.
on:
  pull_request:
    branches: [next, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  repo-guards:
    name: 'repo: guards'
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Reject sibling ../MJ references
        run: ./.github/scripts/validate-no-sibling-mj-paths.sh

      - name: Check every metadata folder is in directoryOrder
        run: ./.github/scripts/validate-metadata-directory-order.sh

      - name: Generated forms put no field in the Details panel
        run: |
          node ./.github/scripts/check-form-details-panel.mjs --self-test
          node ./.github/scripts/check-form-details-panel.mjs
