name: Build All Packages

on:
  workflow_dispatch:
  push:
    branches: [next]
    paths:
      # pnpm-workspace.yaml + package.json affect resolution (overrides,
      # onlyBuiltDependencies, deps) — build must re-run when they change.
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'packages/**'
  pull_request:
    # No `paths` filter, and `main` included: the release PR (next -> main) is the
    # highest-stakes merge in the repo — it publishes to npm — and was the ONE merge
    # nothing built. Skipping on paths is only sound when the BASE is known green;
    # main's package set has never been built, so it must run unconditionally.
    branches: [next, main]

# Least-privilege token: nothing in this workflow writes to the repository.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA-pinned)

      # Must precede setup-node: `cache: 'pnpm'` needs pnpm already on PATH.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (current v4 tag), SHA-pinned

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (SHA-pinned)
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Validate repository.url in packages
        run: ./.github/scripts/validate-package-repository.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build:packages

      # Unit tests. Runs even when the build step above fails: turbo builds each
      # tested package's own dependencies first, so a failure in an unrelated
      # package should not stop the suites from executing.
      #
      # `pnpm run test` is turbo-driven and runs every package's unit tests,
      # excluding only the integration tests. Until this step existed, NO workflow
      # in this repo ran a test: the suites were green only on whoever's laptop
      # last ran them.
      - name: Unit tests
        if: always()
        run: pnpm run test
